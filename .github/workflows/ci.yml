name: 接口自动化测试

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  static-check:
    name: 静态检查（编译 + 用例收集）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 静态检查不需要连真实环境，用模板生成一份占位配置就够了。
      # 少了这一步，config.py 会在 import 阶段就因缺少环境变量抛异常，
      # 导致一条用例都收集不到 —— 检查本身反而把 CI 卡死。
      - name: 生成占位配置
        run: cp .env.example .env

      # 这一步能挡住模块导入错误：之前配置里删掉一个常量、
      # 测试文件还在 import 它，pytest 一条用例都收集不到
      - name: 语法编译检查
        run: python -m compileall -q api common testcases conftest.py

      - name: 用例收集检查
        run: pytest --collect-only -q

  # 这个作业要连内网服务，托管 runner 访问不到，所以只在手动触发时运行，
  # 地址和账号通过 Secret 注入。
  api-test:
    name: 接口测试（需配置 Seafile 环境）
    runs-on: ubuntu-latest
    needs: static-check
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行全量接口测试
        env:
          SEAFILE_BASE_URL: ${{ secrets.SEAFILE_BASE_URL }}
          SEAFILE_ADMIN_EMAIL: ${{ secrets.SEAFILE_ADMIN_EMAIL }}
          SEAFILE_ADMIN_PASSWORD: ${{ secrets.SEAFILE_ADMIN_PASSWORD }}
          SEAFILE_MEMBER_EMAIL: ${{ secrets.SEAFILE_MEMBER_EMAIL }}
          SEAFILE_MEMBER_PASSWORD: ${{ secrets.SEAFILE_MEMBER_PASSWORD }}
        run: pytest --alluredir=allure-results

      - name: 上传 Allure 原始结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
